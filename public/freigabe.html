<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freigabe — VHS Spandau</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blau:#00285A;--blau60:#69829B;--blau20:#CDD7DC;--blau10:#E6EBF0;
  --gelb:#FAB90F;--rot:#E1000F;--gruen:#AFC805;--hellblau:#64B9E6;--orange:#EB640F;
  --grau:#f4f5f7;
}
body{font-family:'DM Sans',sans-serif;background:var(--grau);color:var(--blau);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.header{background:var(--blau);height:54px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{display:flex;align-items:center}
.logo-text{color:#fff;font-size:13px;font-weight:600;line-height:1.2}
.logo-sub{color:var(--blau60);font-size:10px}
.ext-nav-bar{background:#0a1e3d;border-bottom:1px solid rgba(255,255,255,.1);padding:0 18px;display:flex;align-items:center;gap:2px;overflow-x:auto;flex-shrink:0}
.ext-nav-tab{padding:10px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
.ext-nav-tab:hover{color:#fff}
.ext-nav-tab.active{color:#fff;border-bottom-color:var(--gelb,#FAB90F)}
.ext-nav-user{margin-left:auto;font-size:11px;color:rgba(255,255,255,.5);padding:0 6px;flex-shrink:0}
.ext-logout-btn{margin-left:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 11px;color:rgba(255,255,255,.75);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all .15s;flex-shrink:0}
.ext-logout-btn:hover{background:rgba(255,255,255,.18);color:#fff}

/* STATS */
.stats-bar{background:#fff;border-bottom:1px solid #dde2e9;padding:12px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--blau60)}
.stat-n{font-size:18px;font-weight:700;color:var(--blau)}
.stat-dot{width:10px;height:10px;border-radius:50%}

/* FILTER */
.filter-bar{background:#fff;border-bottom:1px solid #eef1f6;padding:10px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fchip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid #dde2e9;cursor:pointer;background:#fff;color:var(--blau60);transition:all .15s}
.fchip:hover{border-color:var(--blau60)}
.fchip.on{background:var(--blau);border-color:var(--blau);color:#fff}
.fchip.f-neu.on{background:#185FA5;border-color:#185FA5}
.fchip.f-freigabe.on{background:var(--orange);border-color:var(--orange)}
.fchip.f-freigegeben.on{background:var(--gruen);border-color:var(--gruen)}
.fchip.f-abgelehnt.on{background:var(--rot);border-color:var(--rot)}
.filter-right{margin-left:auto;display:flex;gap:8px}
.neue-btn{padding:7px 14px;border-radius:8px;background:var(--blau);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.neue-btn:hover{background:#001f47}

/* MAIN */
.main{flex:1;padding:20px 22px;max-width:960px;margin:0 auto;width:100%}

/* EINREICHUNGS-KARTEN */
.einr-liste{display:flex;flex-direction:column;gap:12px}
.einr-karte{background:#fff;border-radius:12px;border:1.5px solid #e2e7ef;overflow:hidden;transition:border-color .15s}
.einr-karte:hover{border-color:var(--blau20)}
.einr-karte.st-neu{border-left:4px solid #64B9E6}
.einr-karte.st-freigabe{border-left:4px solid var(--orange)}
.einr-karte.st-freigegeben{border-left:4px solid var(--gruen)}
.einr-karte.st-abgelehnt{border-left:4px solid var(--rot);opacity:.7}
.einr-karte.st-veroeffentlicht{border-left:4px solid var(--blau60);opacity:.6}

.ek-head{padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.ek-status{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px}
.st-neu .ek-status{background:#E6F1FB}
.st-freigabe .ek-status{background:#FEF3DA}
.st-freigegeben .ek-status{background:#EAF3DE}
.st-abgelehnt .ek-status{background:#FCEBEB}
.st-veroeffentlicht .ek-status{background:var(--blau10)}
.ek-info{flex:1;min-width:0}
.ek-anlass{font-size:14px;font-weight:700;color:var(--blau);margin-bottom:2px}
.ek-meta{font-size:11px;color:var(--blau60);display:flex;gap:10px;flex-wrap:wrap}
.ek-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.pill-neu{background:#E6F1FB;color:#185FA5}
.pill-freigabe{background:#FEF3DA;color:#996B00}
.pill-freigegeben{background:#EAF3DE;color:#3B6D11}
.pill-abgelehnt{background:#FCEBEB;color:var(--rot)}
.pill-veroeffentlicht{background:var(--blau10);color:var(--blau60)}

.ek-body{padding:0 16px 12px 56px}
.ek-kurs{font-size:12px;color:var(--blau);font-weight:500;margin-bottom:4px}
.ek-idee{font-size:12px;color:var(--blau60);line-height:1.55;margin-bottom:8px}
.ek-kommentar{background:#FEF9EC;border:1px solid var(--gelb);border-radius:6px;padding:8px 12px;font-size:11px;color:#6B4800;margin-bottom:8px}
.ek-kommentar strong{font-weight:600}

.ek-actions{display:flex;gap:7px;flex-wrap:wrap}
.ea-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:1.5px solid;cursor:pointer;background:#fff;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;gap:5px}
.ea-btn.gen{color:var(--blau);border-color:var(--blau20)}.ea-btn.gen:hover{background:var(--blau10)}
.ea-btn.approve{color:#3B6D11;border-color:var(--gruen)}.ea-btn.approve:hover{background:#EAF3DE}
.ea-btn.publish{color:#fff;background:var(--gruen);border-color:var(--gruen)}
.ea-btn.reject{color:var(--rot);border-color:var(--rot)}.ea-btn.reject:hover{background:#FCEBEB}
.ea-btn.politik{color:#996B00;border-color:var(--orange)}.ea-btn.politik:hover{background:#FEF3DA}

/* MODAL für Kommentar/Ablehnung */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px 12px;border-bottom:1px solid #eef1f6;display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:14px;font-weight:700;color:var(--blau)}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--blau60)}
.modal-body{padding:16px 20px}
.ml{font-size:10px;font-weight:700;color:var(--blau60);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.mt{width:100%;border:1.5px solid #dde2e9;border-radius:7px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--blau);outline:none;transition:border-color .15s;resize:vertical;min-height:80px;line-height:1.5}
.mt:focus{border-color:var(--blau)}
.modal-foot{padding:12px 20px 16px;border-top:1px solid #eef1f6;display:flex;gap:8px;justify-content:flex-end}
.mc{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:500;background:#fff;border:1.5px solid #dde2e9;color:var(--blau60);cursor:pointer;font-family:'DM Sans',sans-serif}
.ms{padding:8px 18px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.ms.ablehnen{background:var(--rot)}.ms.ablehnen:hover{background:#b30000}
.ms.freigeben{background:var(--gruen)}.ms.freigeben:hover{background:#8aa004}

/* NEUE EINREICHUNG MODAL */
.neue-modal{max-width:520px}
.nf{width:100%;border:1.5px solid #dde2e9;border-radius:7px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--blau);outline:none;transition:border-color .15s;background:#fff;margin-bottom:0}
.nf:focus{border-color:var(--blau)}
.nf-ta{resize:vertical;min-height:70px;line-height:1.5}
.nf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nf-group{display:flex;flex-direction:column;gap:4px}
.nf-label{font-size:10px;font-weight:700;color:var(--blau60);text-transform:uppercase;letter-spacing:.6px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--blau60)}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:600;color:var(--blau);margin-bottom:4px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--blau);color:#fff;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .3s;z-index:999;white-space:nowrap;display:flex;align-items:center;gap:7px}
.toast.show{transform:translateX(-50%) translateY(0)}
.t-dot{width:16px;height:16px;border-radius:50%;background:var(--gruen);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
        <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="200" height="40" viewBox="0 0 200 40"><text x="0" y="28" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">vhs</text><circle cx="68" cy="12" r="5" fill="#9BAAB8"/><circle cx="78" cy="8" r="6" fill="#FAB90F"/><circle cx="89" cy="13" r="5" fill="#64B9E6"/><circle cx="70" cy="23" r="6" fill="#E1000F"/><circle cx="83" cy="26" r="4" fill="#9BAAB8"/><text x="100" y="17" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#8BAABF">Volkshochschule</text><text x="100" y="32" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#ffffff">Spandau</text></svg></div>
  </div>
  
</div>

<div class="ext-nav-bar" id="ext-nav-bar">
  <a href="/" class="ext-nav-tab">← App</a>
</div>
<script>
(async function() {
  try {
    const r = await fetch('/api/me', { credentials:'include' });
    if (!r.ok) return;
    const { user } = await r.json();
    const role = user.role;
    const PAGES = [
      { label:'📅 Redaktionsplan', url:'/kalender',           roles:['admin','redakteur','pbl'] },
      { label:'📬 Kursvorschläge',  url:'/?screen=pbl',        roles:['admin','pbl'] },
      { label:'📚 Kursliste',        url:'/?screen=kurse',      roles:['admin','redakteur','pbl'] },
      { label:'✏️ Redaktion',        url:'/?screen=redakteur',  roles:['admin','redakteur'] },
      { label:'🎨 Grafik-Studio',    url:'/editor',             roles:['admin','redakteur'] },
      { label:'✅ Freigabe',          url:'/freigabe',           roles:['admin','redakteur'] },
      { label:'📊 Dashboard',        url:'/?screen=direktion',  roles:['admin','redakteur','direktion'] },
      { label:'📈 Performance',      url:'/performance',        roles:['admin','redakteur','direktion'] },
      { label:'⚙️ Admin',            url:'/?screen=admin',      roles:['admin'] },
    
    
    ];
    const nav = PAGES
      .filter(p => p.roles.includes(role))
      .map(p => {
        const isActive = !p.url.startsWith('/?') && window.location.pathname === p.url;
        return '<a href="'+p.url+'" class="ext-nav-tab'+(isActive?' active':'')+'">'+p.label+'</a>';
      }).join('');
    document.getElementById('ext-nav-bar').innerHTML = nav +
      '<span class="ext-nav-user">👤 '+user.name.split(' ')[0]+'</span>' +
      '<button class="ext-logout-btn" onclick="extLogout()">Abmelden</button>';
  } catch(e) {}
})();
async function extLogout() {
  await fetch('/api/logout', { method:'POST', credentials:'include' });
  window.location.href = '/';
}
</script>


<!-- STATS -->
<div class="stats-bar" id="stats-bar">
  <div class="stat"><div class="stat-dot" style="background:#64B9E6"></div><div><div class="stat-n" id="s-neu">–</div><div>Neu</div></div></div>
  <div class="stat"><div class="stat-dot" style="background:var(--orange)"></div><div><div class="stat-n" id="s-freigabe">–</div><div>Freigabe nötig</div></div></div>
  <div class="stat"><div class="stat-dot" style="background:var(--gruen)"></div><div><div class="stat-n" id="s-freigegeben">–</div><div>Freigegeben</div></div></div>
  <div class="stat"><div class="stat-dot" style="background:var(--rot)"></div><div><div class="stat-n" id="s-abgelehnt">–</div><div>Abgelehnt</div></div></div>
</div>

<!-- FILTER -->
<div class="filter-bar">
  <div class="fchip on"          onclick="setFilter('alle')">Alle</div>
  <div class="fchip f-neu"       onclick="setFilter('neu')">🔵 Neu</div>
  <div class="fchip f-freigabe"  onclick="setFilter('freigabe')">🟠 Freigabe nötig</div>
  <div class="fchip f-freigegeben" onclick="setFilter('freigegeben')">🟢 Freigegeben</div>
  <div class="fchip f-abgelehnt" onclick="setFilter('abgelehnt')">🔴 Abgelehnt</div>
  <div class="filter-right">
    <button class="neue-btn" onclick="openNeueModal()">＋ Neue Einreichung</button>
  </div>
</div>

<div class="main">
  <div class="einr-liste" id="einr-liste">
    <div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Lädt…</div></div>
  </div>
</div>

<!-- KOMMENTAR / ABLEHNUNG MODAL -->
<div class="modal-overlay" id="modal-kommentar" onclick="closeKommentarModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-kommentar-title">Einreichung ablehnen</div>
      <button class="modal-close" onclick="closeKommentarModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      <div class="ml">Kommentar / Begründung</div>
      <textarea class="mt" id="kommentar-text" placeholder="Bitte kurz begründen — wird an die PBL weitergeleitet …"></textarea>
    </div>
    <div class="modal-foot">
      <button class="mc" onclick="closeKommentarModalDirect()">Abbrechen</button>
      <button class="ms ablehnen" id="kommentar-btn" onclick="submitKommentar()">Ablehnen</button>
    </div>
  </div>
</div>

<!-- NEUE EINREICHUNG MODAL -->
<div class="modal-overlay" id="modal-neue" onclick="closeNeueModal(event)">
  <div class="modal neue-modal">
    <div class="modal-head">
      <div class="modal-title">Neue Einreichung</div>
      <button class="modal-close" onclick="closeNeueModalDirect()">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:12px">
      <div class="nf-group">
        <div class="nf-label">Anlass / Hook</div>
        <input class="nf" id="nf-anlass" type="text" placeholder="z. B. Internationaler Yogatag — 21. Juni 2026">
      </div>
      <div class="nf-row">
        <div class="nf-group">
          <div class="nf-label">Anlass-Datum</div>
          <input class="nf" id="nf-datum" type="date">
        </div>
        <div class="nf-group">
          <div class="nf-label">Kursnummer (opt.)</div>
          <input class="nf" id="nf-kursnr" type="text" placeholder="z. B. Sp3.316-W">
        </div>
      </div>
      <div class="nf-group">
        <div class="nf-label">Kurs / Inhalt</div>
        <input class="nf" id="nf-kurs" type="text" placeholder="Yoga Grundkurs, Qi Gong …">
      </div>
      <div class="nf-group">
        <div class="nf-label">Idee / Bezug zum Anlass</div>
        <textarea class="nf nf-ta" id="nf-idee" placeholder="Was soll der Post vermitteln? Warum passt dieser Kurs?"></textarea>
      </div>
      <div class="nf-group">
        <div class="nf-label">Hashtag-Wunsch (opt.)</div>
        <input class="nf" id="nf-hashtags" type="text" placeholder="#vhsspandau #yoga …">
      </div>
    </div>
    <div class="modal-foot">
      <button class="mc" onclick="closeNeueModalDirect()">Abbrechen</button>
      <button class="ms freigeben" onclick="submitNeue()">📬 Einreichen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="t-dot">✓</div><span id="toast-msg"></span></div>

<script>
let currentUser = null;
let alleEinr    = [];
let aktFilter   = 'alle';
let kommentarId = null;
let kommentarAktion = null;

const STATUS_ICONS  = {neu:'🔵',freigabe:'🟠',freigegeben:'🟢',abgelehnt:'🔴',veroeffentlicht:'⚫'};
const STATUS_LABELS = {neu:'Neu',freigabe:'Freigabe nötig',freigegeben:'Freigegeben',abgelehnt:'Abgelehnt',veroeffentlicht:'Veröffentlicht'};
const STATUS_PILLS  = {neu:'pill-neu',freigabe:'pill-freigabe',freigegeben:'pill-freigegeben',abgelehnt:'pill-abgelehnt',veroeffentlicht:'pill-veroeffentlicht'};

window.addEventListener('load', async () => {
  try {
    const r = await fetch('/api/me', { credentials:'include' });
    if (!r.ok) { window.location.href = '/'; return; }
    const d = await r.json();
    currentUser = d.user;
    const hdrSub = document.getElementById('hdr-sub'); if (hdrSub) hdrSub.textContent = currentUser.name + ' · ' + currentUser.role;
  } catch { window.location.href = '/'; return; }

  // Demo-Einreichungen laden falls leer
  await ladeEinreichungen();
  if (alleEinr.length === 0) await ladeDemoEinreichungen();
  await ladeEinreichungen();
});

async function ladeEinreichungen() {
  const r = await fetch('/api/einreichungen', { credentials:'include' });
  if (!r.ok) return;
  const d = await r.json();
  alleEinr = d.einreichungen || [];
  updateStats();
  renderListe();
}

async function ladeDemoEinreichungen() {
  const demos = [
    {anlass:'Internationaler Yogatag — 21. Juni 2026', anlassDatum:'2026-06-21', kurs:'Yoga Grundkurs, Qi Gong, Pilates', kursNr:'Sp3.316-W', idee:'Wer kennt das nicht: Der Alltag hetzt, der Körper kämpft mit. Yoga bei uns bringt den Ausgleich — kein Leistungsdruck.', hashtags:'#vhsspandau #yogatag #yoga'},
    {anlass:'Fête de la Musique — 21. Juni 2026',      anlassDatum:'2026-06-21', kurs:'Trommelkurs, Percussion', kursNr:'Sp2.731-H', idee:'Berlin klingt an einem Tag wie ein großes Konzert. Wir spielen mit.', hashtags:'#vhsspandau #fetemusique'},
    {anlass:'Welt-Fototag — 10. August 2026',          anlassDatum:'2026-08-10', kurs:'Naturfotografie', kursNr:'Sp2.610-S', idee:'Ein Tag für alle, die die Welt durch ein Objektiv sehen.', hashtags:'#vhsspandau #weltfototag'},
    {anlass:'Mauerfall-Jahrestag — 9. November 2026',  anlassDatum:'2026-11-09', kurs:'Geschichte & politische Bildung, DonnersTALK', kursNr:'', idee:'Erinnerung ist Haltung. Was der 9. November bedeutet — und was wir daraus lernen.', hashtags:'#vhsspandau #mauerfall #politischebildung'},
  ];
  for (const d of demos) {
    await fetch('/api/einreichungen', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(d)
    });
  }
  // Zweiten als "freigabe" markieren
  await ladeEinreichungen();
  if (alleEinr.length >= 2) {
    await fetch(`/api/einreichungen/${alleEinr[1].id}`, {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status:'freigabe'})
    });
  }
}

function updateStats() {
  const z = s => alleEinr.filter(e => e.status === s).length;
  document.getElementById('s-neu').textContent        = z('neu');
  document.getElementById('s-freigabe').textContent   = z('freigabe');
  document.getElementById('s-freigegeben').textContent= z('freigegeben');
  document.getElementById('s-abgelehnt').textContent  = z('abgelehnt');
}

function setFilter(f) {
  aktFilter = f;
  document.querySelectorAll('.fchip').forEach(c => c.classList.remove('on'));
  const chips = document.querySelectorAll('.fchip');
  const map = ['alle','neu','freigabe','freigegeben','abgelehnt'];
  chips[map.indexOf(f)]?.classList.add('on');
  renderListe();
}

function renderListe() {
  const isAdmin = currentUser && ['admin','redakteur'].includes(currentUser.role);
  let liste = aktFilter === 'alle' ? alleEinr : alleEinr.filter(e => e.status === aktFilter);
  liste = [...liste].sort((a,b) => {
    const ord = {freigabe:0,neu:1,freigegeben:2,abgelehnt:3,veroeffentlicht:4};
    return (ord[a.status]??5) - (ord[b.status]??5) || b.datum.localeCompare(a.datum);
  });

  if (!liste.length) {
    document.getElementById('einr-liste').innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Keine Einreichungen${aktFilter !== 'alle' ? ' in diesem Status' : ''}</div></div>`;
    return;
  }

  document.getElementById('einr-liste').innerHTML = liste.map(e => {
    const dat = e.anlassDatum ? new Date(e.anlassDatum+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}) : '';
    const eingereichtAm = new Date(e.datum).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'});

    let actions = '';
    if (isAdmin) {
      if (e.status === 'neu' || e.status === 'freigabe') {
        actions += `<button class="ea-btn gen" onclick="zuGenerator('${e.id}')">✨ Post generieren</button>`;
        actions += `<button class="ea-btn approve" onclick="statusAendern('${e.id}','freigegeben')">✅ Freigeben</button>`;
        // Politische Themen
        const politisch = (e.kurs||'').toLowerCase().includes('politi') || (e.anlass||'').toLowerCase().includes('politi') || (e.anlass||'').toLowerCase().includes('mauerfall');
        if (politisch) {
          actions += `<button class="ea-btn politik" onclick="showToast('⚠️ Politisches Thema — bitte Marion Altendorf um Freigabe bitten')">⚠️ Politisch → Direktion</button>`;
        }
        actions += `<button class="ea-btn reject" onclick="openKommentarModal('${e.id}','ablehnen')">✕ Ablehnen</button>`;
      }
      if (e.status === 'freigegeben') {
        actions += `<button class="ea-btn gen" onclick="zuGenerator('${e.id}')">✨ Post generieren</button>`;
        actions += `<button class="ea-btn publish" onclick="statusAendern('${e.id}','veroeffentlicht')">🚀 Veröffentlicht</button>`;
        actions += `<button class="ea-btn reject" onclick="openKommentarModal('${e.id}','ablehnen')">✕ Zurückziehen</button>`;
      }
    }

    return `<div class="einr-karte st-${e.status}">
      <div class="ek-head">
        <div class="ek-status">${STATUS_ICONS[e.status]||'⚪'}</div>
        <div class="ek-info">
          <div class="ek-anlass">${esc(e.anlass)}</div>
          <div class="ek-meta">
            <span class="ek-pill ${STATUS_PILLS[e.status]||''}">${STATUS_LABELS[e.status]||e.status}</span>
            ${dat?`<span>📅 ${dat}</span>`:''}
            <span>👤 ${esc(e.vonName)}</span>
            ${e.pb&&e.pb!=='alle'?`<span>🏷 ${esc(e.pb)}</span>`:''}
            <span style="color:#ccc">Eingereicht: ${eingereichtAm}</span>
          </div>
        </div>
      </div>
      <div class="ek-body">
        ${e.kurs?`<div class="ek-kurs">📚 ${esc(e.kurs)}${e.kursNr?' · '+esc(e.kursNr):''}</div>`:''}
        ${e.idee?`<div class="ek-idee">${esc(e.idee)}</div>`:''}
        ${e.kommentar?`<div class="ek-kommentar"><strong>Kommentar:</strong> ${esc(e.kommentar)}</div>`:''}
        ${actions?`<div class="ek-actions">${actions}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

async function statusAendern(id, status, kommentar) {
  const r = await fetch(`/api/einreichungen/${id}`, {
    method:'PUT', credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ status, kommentar: kommentar || '' })
  });
  if (!r.ok) return;
  const labels = {freigegeben:'✅ Freigegeben',abgelehnt:'✕ Abgelehnt',veroeffentlicht:'🚀 Veröffentlicht',freigabe:'🟠 Zur Freigabe weitergeleitet'};
  showToast(labels[status] || 'Status geändert');
  await ladeEinreichungen();
}

function zuGenerator(id) {
  const e = alleEinr.find(x => x.id === id);
  if (!e) return;
  // Status auf "freigabe" setzen damit Redakteur es sieht
  statusAendern(id, 'freigabe');
  // Neuen Tab öffnen — Session bleibt hier erhalten
  const params = new URLSearchParams({
    einreichung: id,
    anlass: e.anlass || '',
    kurs:   e.kurs   || '',
    kursNr: e.kursNr || '',
    idee:   e.idee   || '',
  });
  window.open(`/?${params}`, '_blank');
}

// Kommentar-Modal
function openKommentarModal(id, aktion) {
  kommentarId = id;
  kommentarAktion = aktion;
  const btn = document.getElementById('kommentar-btn');
  document.getElementById('modal-kommentar-title').textContent = aktion === 'ablehnen' ? 'Einreichung ablehnen' : 'Kommentar hinzufügen';
  btn.textContent = aktion === 'ablehnen' ? 'Ablehnen' : 'Speichern';
  btn.className = 'ms ' + (aktion === 'ablehnen' ? 'ablehnen' : 'freigeben');
  document.getElementById('kommentar-text').value = '';
  document.getElementById('modal-kommentar').classList.add('open');
  setTimeout(() => document.getElementById('kommentar-text').focus(), 50);
}
function closeKommentarModal(e) { if (e.target === document.getElementById('modal-kommentar')) closeKommentarModalDirect(); }
function closeKommentarModalDirect() { document.getElementById('modal-kommentar').classList.remove('open'); }
async function submitKommentar() {
  const kommentar = document.getElementById('kommentar-text').value.trim();
  const status = kommentarAktion === 'ablehnen' ? 'abgelehnt' : 'neu';
  await statusAendern(kommentarId, status, kommentar);
  closeKommentarModalDirect();
}

// Neue Einreichung Modal
function openNeueModal() {
  ['nf-anlass','nf-datum','nf-kursnr','nf-kurs','nf-idee','nf-hashtags'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('modal-neue').classList.add('open');
  setTimeout(() => document.getElementById('nf-anlass').focus(), 50);
}
function closeNeueModal(e) { if (e.target === document.getElementById('modal-neue')) closeNeueModalDirect(); }
function closeNeueModalDirect() { document.getElementById('modal-neue').classList.remove('open'); }
async function submitNeue() {
  const anlass = document.getElementById('nf-anlass').value.trim();
  if (!anlass) { document.getElementById('nf-anlass').focus(); return; }
  const r = await fetch('/api/einreichungen', {
    method:'POST', credentials:'include',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      anlass,
      anlassDatum: document.getElementById('nf-datum').value,
      kursNr:      document.getElementById('nf-kursnr').value.trim(),
      kurs:        document.getElementById('nf-kurs').value.trim(),
      idee:        document.getElementById('nf-idee').value.trim(),
      hashtags:    document.getElementById('nf-hashtags').value.trim(),
    })
  });
  if (!r.ok) return;
  closeNeueModalDirect();
  showToast('📬 Einreichung gespeichert');
  await ladeEinreichungen();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
