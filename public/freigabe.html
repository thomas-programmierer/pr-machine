<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freigabe — VHS Spandau PR-Maschine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blau:#00285A;--blau80:#375578;--blau60:#69829B;--blau20:#CDD7DC;--blau10:#E6EBF0;
  --gelb:#FAB90F;--rot:#E1000F;--gruen:#AFC805;--hellblau:#64B9E6;--orange:#EB640F;
  --grau:#f4f5f7;
}
body{font-family:'DM Sans',sans-serif;background:var(--grau);color:var(--blau);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.topbar{background:var(--blau);height:52px;display:flex;align-items:center;padding:0 20px;gap:12px;border-bottom:2px solid var(--gelb);flex-shrink:0}
.tb-logo{display:flex;align-items:center;gap:8px}
.tb-title{font-size:13px;font-weight:700;color:#fff}
.tb-tag{font-size:10px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 11px;color:rgba(255,255,255,.7);font-size:11px;font-weight:500;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;transition:all .15s}
.tb-back:hover{background:rgba(255,255,255,.16);color:#fff}
.user-info{font-size:11px;color:rgba(255,255,255,.5)}

/* MAIN */
.main{flex:1;padding:20px 22px;max-width:1100px;width:100%;margin:0 auto}

/* TABS */
.tabs{display:flex;gap:2px;background:#fff;border:1.5px solid #dde2e9;border-radius:10px;padding:4px;margin-bottom:18px;width:fit-content}
.tab-btn{padding:6px 16px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--blau60);transition:all .15s;font-family:'DM Sans',sans-serif}
.tab-btn.active{background:var(--blau);color:#fff}
.tab-count{background:var(--gelb);color:var(--blau);border-radius:8px;padding:0 5px;font-size:10px;margin-left:4px;font-weight:700}

/* STATS BAR */
.stats-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-pill{background:#fff;border:1.5px solid #dde2e9;border-radius:20px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--blau60);display:flex;align-items:center;gap:6px}
.stat-pill span{font-size:13px;font-weight:700;color:var(--blau)}
.stat-pill.orange{border-color:var(--orange);background:#fff8f2}
.stat-pill.orange span{color:var(--orange)}
.stat-pill.green{border-color:var(--gruen);background:#f9fce8}
.stat-pill.green span{color:#3B6D11}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* POST CARD */
.post-card{background:#fff;border-radius:12px;border:1.5px solid #e2e7ef;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
.post-card:hover{box-shadow:0 4px 16px rgba(0,40,90,.1)}
.post-card.warten{border-top:3px solid var(--orange)}
.post-card.direktion{border-top:3px solid var(--hellblau)}
.post-card.freigegeben{border-top:3px solid var(--gruen)}
.post-card.abgelehnt{border-top:3px solid var(--rot);opacity:.75}

.pc-head{padding:12px 14px 8px;display:flex;align-items:flex-start;gap:10px}
.pc-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.s-warten{background:var(--orange)}
.s-direktion{background:var(--hellblau)}
.s-freigegeben{background:var(--gruen)}
.s-abgelehnt{background:var(--rot)}
.pc-meta{flex:1;min-width:0}
.pc-anlass{font-size:13px;font-weight:600;color:var(--blau);line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-sub{font-size:10px;color:var(--blau60);display:flex;gap:8px;flex-wrap:wrap}
.pc-pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.pill-warten{background:#FFF0E6;color:#8B4000}
.pill-direktion{background:#E4F2FB;color:#1B5E86}
.pill-freigegeben{background:#EAF3DE;color:#3B6D11}
.pill-abgelehnt{background:#FCEBEB;color:#791F1F}

/* PREVIEW */
.pc-preview{margin:0 14px 10px;border-radius:8px;overflow:hidden;background:var(--blau10);min-height:60px;max-height:180px;display:flex;align-items:center;justify-content:center;position:relative}
.pc-preview img{width:100%;height:180px;object-fit:cover;display:block}
.pc-preview-placeholder{font-size:28px;color:var(--blau20);padding:20px}

/* TEXT */
.pc-text{padding:0 14px 10px;font-size:11px;color:var(--blau60);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* FOOTER ACTIONS */
.pc-foot{padding:10px 14px 12px;border-top:1px solid #eef1f6;display:flex;gap:7px;align-items:center}
.pc-autor{font-size:10px;color:var(--blau60);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-datum{font-size:10px;color:var(--blau60)}
.btn-approve{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:700;background:var(--gruen);color:#fff;border:none;cursor:pointer;transition:background .15s}
.btn-approve:hover{background:#8faa04}
.btn-reject{padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;background:#fff;color:var(--blau60);border:1.5px solid #dde2e9;cursor:pointer;transition:all .15s}
.btn-reject:hover{border-color:var(--rot);color:var(--rot)}
.btn-undo{padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;background:#fff;color:var(--blau60);border:1.5px solid #dde2e9;cursor:pointer}

/* DETAIL MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid #eef1f6;display:flex;align-items:center;gap:10px}
.modal-title{font-size:15px;font-weight:600;color:var(--blau);flex:1}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--blau60);padding:2px 6px}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.ml{font-size:10px;font-weight:700;color:var(--blau60);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.modal-preview-wrap{border-radius:8px;overflow:hidden;background:var(--blau10);display:flex;align-items:center;justify-content:center;min-height:80px}
.modal-preview-wrap img{max-width:100%;max-height:300px;object-fit:contain;display:block}
.modal-text{font-size:12px;color:var(--blau);line-height:1.7;background:var(--blau10);border-radius:8px;padding:12px;white-space:pre-wrap}
.modal-foot{padding:14px 20px 18px;border-top:1px solid #eef1f6;display:flex;gap:8px;justify-content:flex-end}
.btn-modal-approve{padding:9px 22px;border-radius:8px;font-size:12px;font-weight:700;background:var(--gruen);color:#fff;border:none;cursor:pointer}
.btn-modal-reject{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;background:#fff;color:var(--blau60);border:1.5px solid #dde2e9;cursor:pointer}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--blau60)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:600;color:var(--blau);margin-bottom:5px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--blau);color:#fff;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .3s;z-index:999;white-space:nowrap;display:flex;align-items:center;gap:7px;border:1px solid var(--gelb)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* LOGIN REDIRECT */
#login-required{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:40px;text-align:center;color:var(--blau60)}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="32" viewBox="0 0 160 32">
      <text x="0" y="22" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">vhs</text>
      <circle cx="52" cy="9" r="4" fill="#9BAAB8"/>
      <circle cx="60" cy="6" r="5" fill="#FAB90F"/>
      <circle cx="69" cy="10" r="4" fill="#64B9E6"/>
      <circle cx="53" cy="18" r="5" fill="#E1000F"/>
      <circle cx="65" cy="21" r="3" fill="#9BAAB8"/>
      <text x="78" y="13" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="rgba(255,255,255,.55)">Volkshochschule</text>
      <text x="78" y="26" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#fff">Spandau</text>
    </svg>
  </div>
  <div class="tb-tag">⑥ Freigabe</div>
  <div class="tb-right">
    <span class="user-info" id="hdr-user"></span>
    <a href="/voransicht" class="tb-back">👁 Voransicht</a>
    <a href="/" class="tb-back">← Zurück zur App</a>
    <button class="tb-back" onclick="doLogout()">Abmelden</button>
  </div>
</div>

<div id="login-required">
  <div style="font-size:48px">🔐</div>
  <div style="font-size:16px;font-weight:600;color:var(--blau)">Bitte zuerst anmelden</div>
  <div style="font-size:13px">Du wirst in 2 Sekunden weitergeleitet …</div>
</div>

<div class="main" id="main-content" style="display:none">

  <div style="margin-bottom:16px">
    <div style="font-size:18px;font-weight:700;color:var(--blau);margin-bottom:3px">Freigabe-Cockpit</div>
    <div style="font-size:12px;color:var(--blau60)">Zweistufig: Die Redaktion prüft zuerst und gibt an die Direktion weiter — die Direktion erteilt die endgültige Freigabe.</div>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- FILTER TABS -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-alle"     onclick="setFilter('alle')">Alle <span class="tab-count" id="cnt-alle">0</span></button>
    <button class="tab-btn"        id="tab-warten"   onclick="setFilter('freigabe_ausstehend')">Bei Redaktion <span class="tab-count" id="cnt-warten" style="background:var(--orange);color:#fff">0</span></button>
    <button class="tab-btn"        id="tab-direktion" onclick="setFilter('redaktion_frei')">Bei Direktion <span class="tab-count" id="cnt-direktion" style="background:var(--hellblau);color:#fff">0</span></button>
    <button class="tab-btn"        id="tab-frei"     onclick="setFilter('freigegeben')">Freigegeben <span class="tab-count" id="cnt-frei" style="background:var(--gruen);color:#fff">0</span></button>
    <button class="tab-btn"        id="tab-abgelehnt" onclick="setFilter('abgelehnt')">Abgelehnt <span class="tab-count" id="cnt-abgelehnt">0</span></button>
  </div>

  <!-- CARDS -->
  <div class="cards-grid" id="cards-grid">
    <div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Wird geladen …</div></div>
  </div>

</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Post-Details</div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast"><div id="toast-msg"></div></div>

<script>
let currentUser = null;
let allePosts   = [];
let currentFilter = 'alle';
let modalPostId = null;

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/me', { credentials:'include' });
    if (!r.ok) { redirectLogin(); return; }
    const d = await r.json();
    currentUser = d.user;
    const ROLE_LABELS = { admin:'Admin', redakteur:'Redakteur', pbl:'Programmbereichsleitung', direktion:'Direktion' };
    document.getElementById('hdr-user').textContent = currentUser.name + ' · ' + (ROLE_LABELS[currentUser.role]||'');
    document.getElementById('login-required').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    // Aktionen werden pro Karte je nach Rolle und Status gerendert
    // (Redaktion: Stufe 1, Direktion: Stufe 2) — siehe renderCards()
    await ladePosts();
  } catch { redirectLogin(); }
}

function redirectLogin() {
  document.getElementById('login-required').style.display = 'flex';
  setTimeout(() => { window.location.href = '/?screen=freigabe'; }, 2000);
}

async function doLogout() {
  await fetch('/api/logout', { method:'POST', credentials:'include' });
  window.location.href = '/';
}

// ── DATEN ─────────────────────────────────────────────────────────────────────
async function ladePosts() {
  try {
    const r = await fetch('/api/posts', { credentials:'include' });
    if (!r.ok) return;
    allePosts = await r.json();
    // Neueste zuerst
    allePosts.sort((a, b) => (b.erstellt||'').localeCompare(a.erstellt||''));
    updateCounts();
    renderCards();
  } catch(e) { console.error(e); }
}

function updateCounts() {
  const cnt = (s) => allePosts.filter(p => !s || p.status === s).length;
  document.getElementById('cnt-alle').textContent      = cnt('');
  document.getElementById('cnt-warten').textContent    = cnt('freigabe_ausstehend');
  document.getElementById('cnt-direktion').textContent = cnt('redaktion_frei');
  document.getElementById('cnt-frei').textContent      = cnt('freigegeben');
  document.getElementById('cnt-abgelehnt').textContent = cnt('abgelehnt');

  // Stats bar
  document.getElementById('stats-bar').innerHTML = [
    `<div class="stat-pill orange"><span>${cnt('freigabe_ausstehend')}</span> bei der Redaktion</div>`,
    `<div class="stat-pill"><span>${cnt('redaktion_frei')}</span> warten auf Direktion</div>`,
    `<div class="stat-pill green"><span>${cnt('freigegeben')}</span> freigegeben</div>`,
    `<div class="stat-pill"><span>${cnt('')}</span> Posts gesamt</div>`,
  ].join('');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const map = { alle:'tab-alle', freigabe_ausstehend:'tab-warten', redaktion_frei:'tab-direktion', freigegeben:'tab-frei', abgelehnt:'tab-abgelehnt' };
  document.getElementById(map[f])?.classList.add('active');
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const gefiltert = currentFilter === 'alle'
    ? allePosts
    : allePosts.filter(p => p.status === currentFilter);

  if (!gefiltert.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">📭</div>
      <div class="empty-title">${currentFilter === 'freigabe_ausstehend' ? 'Nichts wartet auf die Redaktion' : currentFilter === 'redaktion_frei' ? 'Nichts wartet auf die Direktion' : 'Keine Posts in dieser Kategorie'}</div>
      <div style="font-size:12px">${currentFilter === 'freigabe_ausstehend' ? 'Sobald ein Redakteur einen Post einreicht, erscheint er hier.' : currentFilter === 'redaktion_frei' ? 'Sobald die Redaktion einen Post weitergibt, erscheint er hier.' : ''}</div>
    </div>`;
    return;
  }

  const STATUS = {
    freigabe_ausstehend: { label:'Bei Redaktion', pill:'pill-warten',     dot:'s-warten',     cls:'warten' },
    redaktion_frei:      { label:'Bei Direktion', pill:'pill-direktion',   dot:'s-direktion',  cls:'direktion' },
    freigegeben:         { label:'✓ Freigegeben', pill:'pill-freigegeben', dot:'s-freigegeben', cls:'freigegeben' },
    abgelehnt:           { label:'Abgelehnt', pill:'pill-abgelehnt', dot:'s-abgelehnt',  cls:'abgelehnt' },
    geplant:             { label:'Geplant', pill:'',                dot:'s-warten',     cls:'warten' },
  };

  grid.innerHTML = gefiltert.map(p => {
    const s = STATUS[p.status] || STATUS.geplant;
    const datum = p.erstellt ? new Date(p.erstellt).toLocaleDateString('de-DE', { day:'2-digit', month:'short', year:'numeric' }) : '';
    const hasPreview = p.preview && p.preview.startsWith('data:image');

    const aktionen = kartenAktionen(p, true);

    return `<div class="post-card ${s.cls}" onclick="openDetail('${p.id}')">
      <div class="pc-head">
        <div class="pc-status ${s.dot}"></div>
        <div class="pc-meta">
          <div class="pc-anlass">${esc(p.anlass||'Unbenannter Post')}</div>
          <div class="pc-sub">
            <span>${esc(p.kanal||'')}</span>
            <span>${esc(p.format||'')}</span>
            <span>${datum}</span>
          </div>
        </div>
        <span class="pc-pill ${s.pill}">${s.label}</span>
      </div>
      ${hasPreview
        ? `<div class="pc-preview"><img src="${p.preview}" alt="Vorschau" loading="lazy"></div>`
        : `<div class="pc-preview"><div class="pc-preview-placeholder">🖼</div></div>`}
      ${p.headline||p.text ? `<div class="pc-text">${esc(p.headline||p.text||'')}</div>` : ''}
      <div class="pc-foot">
        <div class="pc-autor">von ${esc(p.autor||'')}</div>
        ${aktionen}
      </div>
    </div>`;
  }).join('');
}

// ── ROLLEN ────────────────────────────────────────────────────────────────────
function istRedaktion() { return ['admin','redakteur'].includes(currentUser?.role); }
function istDirektion() { return ['admin','direktion'].includes(currentUser?.role); }

// Baut die Aktions-Buttons je nach Status + Rolle.
// modus 'karte' (kompakt) oder 'modal' (große Buttons).
function kartenAktionen(p, kompakt) {
  const stop = kompakt ? 'event.stopPropagation();' : '';
  const app  = kompakt ? 'btn-approve' : 'btn-modal-approve';
  const rej  = kompakt ? 'btn-reject'  : 'btn-modal-reject';
  const undo = kompakt ? 'btn-undo'    : 'btn-modal-reject';

  // Stufe 1: Redaktion prüft neu eingereichte Posts
  if (p.status === 'freigabe_ausstehend' && istRedaktion()) {
    return `<button class="${app}" onclick="${stop}anDirektion('${p.id}')">✅ An Direktion</button>
            <button class="${rej}" onclick="${stop}ablehnen('${p.id}')">✕ Ablehnen</button>`;
  }
  // Stufe 2: Direktion erteilt die endgültige Freigabe
  if (p.status === 'redaktion_frei' && istDirektion()) {
    return `<button class="${app}" onclick="${stop}freigeben('${p.id}')">✅ Freigeben</button>
            <button class="${rej}" onclick="${stop}ablehnen('${p.id}')">✕ Ablehnen</button>`;
  }
  // Redaktion kann eine Weitergabe an die Direktion zurücknehmen
  if (p.status === 'redaktion_frei' && istRedaktion()) {
    return `<button class="${undo}" onclick="${stop}zurueckRedaktion('${p.id}')">↩ Zurückziehen</button>`;
  }
  // Direktion kann eine erteilte Freigabe rückgängig machen
  if (p.status === 'freigegeben' && istDirektion()) {
    return `<button class="${undo}" onclick="${stop}zurueckDirektion('${p.id}')">↩ Freigabe zurücknehmen</button>`;
  }
  return '';
}

// ── AKTIONEN ──────────────────────────────────────────────────────────────────
async function anDirektion(id) {
  await setStatus(id, 'redaktion_frei');
  showToast('✅ An die Direktion weitergeleitet');
}
async function freigeben(id) {
  await setStatus(id, 'freigegeben');
  showToast('✅ Post endgültig freigegeben');
}
async function ablehnen(id) {
  await setStatus(id, 'abgelehnt');
  showToast('↩️ Post abgelehnt');
}
async function zurueckRedaktion(id) {
  await setStatus(id, 'freigabe_ausstehend');
  showToast('↩ Weitergabe zurückgezogen');
}
async function zurueckDirektion(id) {
  await setStatus(id, 'redaktion_frei');
  showToast('↩ Freigabe zurückgenommen');
}
async function setStatus(id, status) {
  try {
    const r = await fetch('/api/posts/' + id, {
      method:'PUT', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status, freigegeben_von: currentUser?.name, freigegeben_am: new Date().toISOString() })
    });
    if (!r.ok) { showToast('⚠️ Fehler beim Speichern'); return; }
  } catch { showToast('⚠️ Server nicht erreichbar'); return; }
  const idx = allePosts.findIndex(p => p.id === id);
  if (idx !== -1) allePosts[idx].status = status;
  if (modalPostId === id) closeModalDirect();
  updateCounts();
  renderCards();
}

// ── DETAIL MODAL ──────────────────────────────────────────────────────────────
function openDetail(id) {
  const p = allePosts.find(x => x.id === id);
  if (!p) return;
  modalPostId = id;
  const datum = p.erstellt ? new Date(p.erstellt).toLocaleString('de-DE') : '';
  const hasPreview = p.preview && p.preview.startsWith('data:image');

  document.getElementById('modal-title').textContent = p.anlass || 'Post-Details';
  document.getElementById('modal-body').innerHTML = `
    ${hasPreview ? `<div><div class="ml">Vorschau</div><div class="modal-preview-wrap"><img src="${p.preview}" alt="Vorschau"></div></div>` : ''}
    <div>
      <div class="ml">Details</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px">
        <div><span style="color:var(--blau60)">Kanal:</span> ${esc(p.kanal||'—')}</div>
        <div><span style="color:var(--blau60)">Format:</span> ${esc(p.format||'—')}</div>
        <div><span style="color:var(--blau60)">Autor:</span> ${esc(p.autor||'—')}</div>
        <div><span style="color:var(--blau60)">Eingereicht:</span> ${datum}</div>
        ${p.datum ? `<div><span style="color:var(--blau60)">Geplant für:</span> ${esc(p.datum)}</div>` : ''}
        ${p.freigegeben_von ? `<div style="grid-column:1/-1"><span style="color:var(--blau60)">Freigegeben von:</span> ${esc(p.freigegeben_von)}</div>` : ''}
      </div>
    </div>
    ${(p.headline||p.fulltext) ? `<div><div class="ml">Post-Text</div><div class="modal-text">${esc(p.headline||'')}${p.fulltext ? '\n\n' + esc(p.fulltext) : ''}</div></div>` : ''}
  `;

  document.getElementById('modal-foot').innerHTML = kartenAktionen(p, false);

  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(e) { if (e.target === document.getElementById('modal-bg')) closeModalDirect(); }
function closeModalDirect() {
  document.getElementById('modal-bg').classList.remove('open');
  modalPostId = null;
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Auto-Refresh alle 30 Sekunden
setInterval(ladePosts, 30000);

window.addEventListener('load', init);
</script>
</body>
</html>
